plugins {
    id 'com.android.application'
}

def getGitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--verify', '--short=8', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    }
    catch (Exception ignored)
    {
        return "????????"
    }
}

android {
    namespace 'com.bvalosek.cpuspy'
    compileSdk 34
    compileOptions.encoding = 'UTF-8'

    aaptOptions {
        additionalParameters "--no-version-vectors"
        cruncherEnabled = false
    }

    defaultConfig {
        applicationId "com.zoffcc.applications.cpuspy"
        minSdk 21
        targetSdk 34
        versionCode 20004
        versionName "2.0.4"

        // Enabling multidex support
        multiDexEnabled true

        vectorDrawables.useSupportLibrary = true

        buildConfigField "String", "GitHash", "\"${getGitHash()}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments useTestStorageService: 'true'
    }

    buildFeatures {
        buildConfig true
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    lint {
        abortOnError false
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        absolutePaths false
        // lintConfig file("lint.xml")
        showAll true
        textReport true
        xmlReport true
        htmlReport true
        textOutput file("lint-report.txt")
        htmlOutput file("lint-report.html")
        xmlOutput file("lint-report.xml")
    }

    signingConfigs {
        testSigning {
            storeFile file('test-key.jks')
            storePassword 'cpuspy'
            keyAlias 'cpuspy'
            keyPassword 'cpuspy'
        }
        releaseSigning {
            def customKeystore = file('release-key.jks')
            if (customKeystore.exists()) {
                def storePass = System.getenv("KEYSTORE_PASSWORD") ? System.getenv("KEYSTORE_PASSWORD").trim() : "cpuspy"
                def alias = System.getenv("KEY_ALIAS") ? System.getenv("KEY_ALIAS").trim() : "cpuspy"
                def keyPass = System.getenv("KEY_PASSWORD") ? System.getenv("KEY_PASSWORD").trim() : storePass

                // Auto-detect if keyPass or storePass unlocks the private key
                def effectiveKeyPass = keyPass
                try {
                    def ks = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
                    customKeystore.withInputStream { is -> ks.load(is, storePass.toCharArray()) }
                    try {
                        ks.getKey(alias, keyPass.toCharArray())
                    } catch (Exception ex1) {
                        try {
                            if (ks.getKey(alias, storePass.toCharArray()) != null) {
                                effectiveKeyPass = storePass
                            }
                        } catch (Exception ignored) {}
                    }
                } catch (Exception ignored) {}

                storeFile customKeystore
                storePassword storePass
                keyAlias alias
                keyPassword effectiveKeyPass
            } else {
                storeFile file('test-key.jks')
                storePassword 'cpuspy'
                keyAlias 'cpuspy'
                keyPassword 'cpuspy'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.testSigning
            crunchPngs false
            ext.enableCrashlytics = false
            minifyEnabled false
            shrinkResources false
            // proguardFile ('proguard-disable.pro')
        }
        release {
            signingConfig signingConfigs.releaseSigning
            crunchPngs false
            ext.enableCrashlytics = false
            minifyEnabled false
            shrinkResources false
            // proguardFile ('proguard-disable.pro')
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "cpuspy-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        encoding "UTF-8"
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
