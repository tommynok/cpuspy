name: Build APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        env:
          KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_DATA" ]; then
            echo "$KEYSTORE_DATA" | base64 -d > app/release-key.jks
            echo "Keystore decoded successfully (size: $(wc -c < app/release-key.jks) bytes)"
          else
            echo "No custom keystore secret provided, using default signing."
          fi

      - name: Build Release and Debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Verify APK Signature
        run: |
          echo "=== Release APK Signature Information ==="
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/*.apk || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: cpuspy-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cpuspy-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.4-b{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('CPU Spy v2.0.4 (Build {0})', github.run_number) }}
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
